<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quincaillerie MVP (Auth)</title>

<style>
body { font-family: Arial; margin: 0; background:#f5f5f5; }
header { background:#2c3e50; color:white; padding:15px; text-align:center; }

nav {
  display:flex;
  background:#34495e;
}
nav button {
  flex:1;
  padding:10px;
  border:none;
  color:white;
  background:none;
  cursor:pointer;
}

section {
  padding:20px;
  display:none;
}
.active { display:block; }

.card {
  background:white;
  padding:15px;
  margin-bottom:10px;
  border-radius:8px;
}

input, select {
  width:100%;
  padding:8px;
  margin:5px 0;
}

button {
  margin-top:5px;
  padding:8px;
  cursor:pointer;
}

.primary {
  background:#27ae60;
  color:white;
  border:none;
}
</style>
</head>

<body>

<header>
  <h1>Gestion Quincaillerie (Auth)</h1>
</header>

<nav id="mainNav" style="display:none;">
  <button onclick="showPage('products')">Produits</button>
  <button onclick="showPage('sales')">Vente</button>
  <button onclick="logout()">Déconnexion</button>
</nav>

<!-- LOGIN -->
<section id="login" class="active">
  <h2>Connexion</h2>
  <input id="username" placeholder="Utilisateur">
  <input id="password" type="password" placeholder="Mot de passe">
  <button class="primary" onclick="login()">Se connecter</button>
  <button onclick="register()">Créer compte</button>
</section>

<!-- PRODUITS -->
<section id="products">
  <h2>Produits</h2>
  <input id="name" placeholder="Nom">
  <input id="price" type="number" placeholder="Prix">
  <input id="stock" type="number" placeholder="Stock">
  <button class="primary" onclick="addProduct()">Ajouter</button>
  <div id="productList"></div>
</section>

<!-- VENTES -->
<section id="sales">
  <h2>Vente</h2>
  <select id="productSelect"></select>
  <input id="qty" type="number" placeholder="Quantité">
  <button class="primary" onclick="makeSale()">Vendre</button>
  <div class="card">
    Total: <span id="saleTotal">0</span> FCFA
  </div>
</section>

<script>
const API_URL = "https://quincaillerie-app-1-hkw7.onrender.com";

let products = [];
let token = localStorage.getItem("token") || null;

// Navigation
function showPage(id){
 document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

// UI selon login
function setAuthUI(){
 if(token){
   document.getElementById("mainNav").style.display = "flex";
   showPage("products");
   loadProducts();
 } else {
   document.getElementById("mainNav").style.display = "none";
   showPage("login");
 }
}

// LOGIN
async function login(){
 const username = document.getElementById("username").value;
 const password = document.getElementById("password").value;

 const res = await fetch(API_URL + "/auth/login",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({username,password})
 });

 const data = await res.json();

 if(data.token){
   token = data.token;
   localStorage.setItem("token", token);
   setAuthUI();
 } else {
   alert("Erreur connexion");
 }
}

// REGISTER
async function register(){
 const username = document.getElementById("username").value;
 const password = document.getElementById("password").value;

 await fetch(API_URL + "/auth/register",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({username,password})
 });

 alert("Compte créé, connecte-toi");
}

// LOGOUT
function logout(){
 token = null;
 localStorage.removeItem("token");
 setAuthUI();
}

// LOAD PRODUITS
async function loadProducts(){
 const res = await fetch(API_URL + "/products",{
  headers:{ "Authorization": "Bearer " + token }
 });

 products = await res.json();
 renderProducts();
 renderSelect();
}

// ADD PRODUIT
async function addProduct(){
 const name = document.getElementById("name").value;
 const price = parseInt(document.getElementById("price").value);
 const stock = parseInt(document.getElementById("stock").value);

 await fetch(API_URL + "/products",{
  method:"POST",
  headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer " + token
  },
  body:JSON.stringify({name, price, stock})
 });

 loadProducts();
}

// AFFICHAGE PRODUITS
function renderProducts(){
 const list = document.getElementById("productList");
 list.innerHTML="";

 products.forEach(p=>{
   list.innerHTML += `
   <div class="card">
     ${p.name} - ${p.price} FCFA - Stock: ${p.stock}
   </div>`;
 });
}

// SELECT POUR VENTE
function renderSelect(){
 const select = document.getElementById("productSelect");
 select.innerHTML="";

 products.forEach(p=>{
   select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
 });
}

// VENTE
async function makeSale(){
 const productId = document.getElementById("productSelect").value;
 const qty = parseInt(document.getElementById("qty").value);

 const res = await fetch(API_URL + "/sales",{
  method:"POST",
  headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer " + token
  },
  body:JSON.stringify({productId, qty})
 });

 const data = await res.json();

 document.getElementById("saleTotal").innerText = data.amount;

 loadProducts();
}

// INIT
setAuthUI();
</script>

</body>
</html>
